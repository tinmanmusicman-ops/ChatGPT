<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradientMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4dd0e1"/>
      <stop offset="100%" stop-color="#3d5afe"/>
    </linearGradient>
    <linearGradient id="gradientPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
    <clipPath id="rounded">
      <rect width="1180" height="880" x="10" y="10" rx="26" ry="26"/>
    </clipPath>
  </defs>
  <rect width="1200" height="900" rx="30" ry="30" fill="#050b18"/>
  <g clip-path="url(#rounded)">
    <rect width="1180" height="880" x="10" y="10" fill="url(#gradientMain)" opacity="0.1"/>
    <text x="600" y="70" font-family="Segoe UI, sans-serif" font-size="28" fill="#e0e7ff" text-anchor="middle" font-weight="600">
      Indeed Email Processor Flow (SVG)
    </text>
    <!-- Main node -->
    <rect x="360" y="110" width="480" height="110" rx="26" ry="26" fill="url(#gradientMain)" stroke="#e6f3ff" stroke-width="2"/>
    <text x="600" y="160" font-family="Segoe UI, sans-serif" font-size="20" fill="#fff" text-anchor="middle">Start / main()</text>
    <text x="600" y="185" font-family="Segoe UI" font-size="14" fill="#cfd8ff" text-anchor="middle">
      load config · debug mode flag · loop for unread emails
    </text>

    <!-- Branch nodes -->
    <rect x="180" y="250" width="260" height="120" rx="20" fill="#0f1f3f" stroke="#8cd1ff" stroke-width="1.5"/>
    <text x="310" y="295" font-family="Segoe UI" font-size="16" fill="#cfd8ff" text-anchor="middle">get_unread_email_body()</text>
    <text x="310" y="315" font-family="Segoe UI" font-size="12" fill="#a8b5ff" text-anchor="middle">
      IMAP fetch · relevance heuristics · label handling
    </text>

    <rect x="720" y="250" width="280" height="130" rx="20" fill="#152040" stroke="#a583ff" stroke-width="1.5"/>
    <text x="860" y="295" font-family="Segoe UI" font-size="16" fill="#cfd8ff" text-anchor="middle">process_email_payload()</text>
    <text x="860" y="320" font-family="Segoe UI" font-size="12" fill="#a8b5ff" text-anchor="middle">
      trim + log · subject fallback for location · call AI extract · append
    </text>

    <rect x="420" y="430" width="320" height="140" rx="22" fill="#5b2d90" stroke="#d08cff" stroke-width="2"/>
    <text x="580" y="460" font-family="Segoe UI" font-size="16" fill="#fff" text-anchor="middle">extract_jobs_from_email()</text>
    <text x="580" y="485" font-family="Segoe UI" font-size="12" fill="#b6a1ff" text-anchor="middle">
      OpenAI prompt · parse JSON · normalize fields
    </text>
    <text x="580" y="505" font-family="Segoe UI" font-size="12" fill="#b6a1ff" text-anchor="middle">
      limit to max jobs and record elapsed time
    </text>

    <rect x="720" y="430" width="340" height="140" rx="22" fill="#1e2e5b" stroke="#8cc8ff" stroke-width="2"/>
    <text x="890" y="460" font-family="Segoe UI" font-size="16" fill="#fff" text-anchor="middle">append_jobs_to_sheet()</text>
    <text x="890" y="485" font-family="Segoe UI" font-size="12" fill="#c0d4ff" text-anchor="middle">
      get worksheet · ensure headers · load existing URLs
    </text>
    <text x="890" y="505" font-family="Segoe UI" font-size="12" fill="#c0d4ff" text-anchor="middle">
      append rows + add notes
    </text>

    <rect x="420" y="620" width="320" height="130" rx="20" fill="#0f1f3f" stroke="#85ffdd" stroke-width="1.5"/>
    <text x="580" y="655" font-family="Segoe UI" font-size="16" fill="#fff" text-anchor="middle">Helper utilities</text>
    <text x="580" y="680" font-family="Segoe UI" font-size="12" fill="#c6d8ff" text-anchor="middle">
      keywords/domain checks · sender extraction · swot formatting · worksheet cache
    </text>

    <rect x="500" y="780" width="260" height="90" rx="20" fill="url(#gradientMain)" stroke="#e6f3ff" stroke-width="1.5"/>
    <text x="630" y="820" font-family="Segoe UI" font-size="16" fill="#fff" text-anchor="middle">Finish / Exit</text>
    <text x="630" y="840" font-family="Segoe UI" font-size="12" fill="#d7e0ff" text-anchor="middle">
      Log totals · end run
    </text>

    <!-- Connectors -->
    <path d="M600 220 L310 250" stroke="#5fe2c2" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <path d="M600 220 L860 250" stroke="#5fe2c2" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <path d="M350 370 L550 430" stroke="#6a86ff" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <path d="M940 370 L900 430" stroke="#6a86ff" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <path d="M580 570 L580 620" stroke="#5fe2c2" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <path d="M660 680 L660 780" stroke="#7b9fff" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <path d="M850 570 L850 620" stroke="#5fe2c2" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  </g>
</svg>
