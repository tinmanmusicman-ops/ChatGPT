<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PhoneEval AI</title>
  <meta name="theme-color" content="#1f6feb">
  <link rel="manifest" href="./manifest.webmanifest">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d1117;
      --panel: #161b22;
      --line: #2f3d4f;
      --text: #e6edf3;
      --muted: #9fb0c2;
      --accent: #1f6feb;
      --ok: #4dd98a;
      --err: #ff7575;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 14px;
      background: radial-gradient(circle at top, #1a202a 0%, var(--bg) 45%);
      color: var(--text);
      font-family: "Segoe UI", Tahoma, sans-serif;
      font-size: 19px;
    }
    .wrap {
      max-width: 940px;
      margin: 0 auto;
      display: grid;
      gap: 12px;
    }
    h1 {
      margin: 0;
      font-size: 1.55rem;
      color: #9ec6ff;
    }
    .hint {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.45;
    }
    .panel {
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--panel);
      padding: 12px;
    }
    label {
      display: block;
      font-weight: 700;
      margin-bottom: 7px;
    }
    input, textarea, button {
      width: 100%;
      border-radius: 10px;
      border: 1px solid #3a495e;
      background: #0f141b;
      color: var(--text);
      font-size: 1rem;
      padding: 11px;
    }
    textarea {
      min-height: 280px;
      line-height: 1.45;
      resize: vertical;
    }
    .row {
      display: grid;
      gap: 8px;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      margin-top: 8px;
    }
    button {
      font-weight: 700;
      background: #183255;
      border-color: #2d4f79;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.6;
      cursor: default;
    }
    .result-view {
      display: grid;
      gap: 8px;
    }
    .result-item {
      border: 1px solid #314056;
      border-radius: 10px;
      padding: 10px;
      background: #0f151d;
      line-height: 1.45;
      word-break: break-word;
    }
    .result-item strong {
      color: #9ec6ff;
      display: block;
      margin-bottom: 4px;
    }
    .status {
      font-weight: 700;
      margin: 0;
    }
    .ok { color: var(--ok); }
    .err { color: var(--err); }
    @media (max-width: 700px) {
      .row { grid-template-columns: 1fr; }
      body { font-size: 20px; padding: 10px; }
      textarea { min-height: 320px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>PhoneEval AI</h1>
    <p id="hintText" class="hint">Phone flow: select text, Share to PhoneEval, and it auto-analyzes to HTML output.</p>

    <section id="endpointPanel" class="panel">
      <label for="endpoint">Flask Analyze Endpoint</label>
      <input id="endpoint" type="text" autocomplete="off" spellcheck="false">
    </section>

    <section id="contentPanel" class="panel">
      <label for="content">Shared or Pasted Content</label>
      <textarea id="content" placeholder="Shared text appears here. You can also paste manually."></textarea>
      <div class="row">
        <button id="analyze" type="button">Analyze</button>
        <button id="paste" type="button">Paste</button>
        <button id="clear" type="button">Clear</button>
      </div>
    </section>

    <section class="panel">
      <p id="status" class="status">Status: idle</p>
      <div id="result" class="result-view">
        <div class="result-item"><strong>Summary</strong><span id="summaryText">-</span></div>
        <div class="result-item"><strong>KeyPoints</strong><span id="keyPointsText">-</span></div>
        <div class="result-item"><strong>ActionItems</strong><span id="actionItemsText">-</span></div>
      </div>
      <div class="row">
        <button id="copy" type="button">Copy Result</button>
        <button id="share" type="button">Share Result</button>
        <button id="save-endpoint" type="button">Save Endpoint</button>
      </div>
    </section>
  </main>

  <script>
    const CONFIG_PATH = "./tower.config.json";
    const ENDPOINT_KEY = "phone_eval_endpoint";
    const ENDPOINT_PINNED_KEY = "phone_eval_endpoint_pinned";
    let cachedConfigEndpoint = "";
    let cachedConfigLoadedAt = 0;
    const CONFIG_CACHE_TTL_MS = 15000;

    const endpointEl = document.getElementById("endpoint");
    const contentEl = document.getElementById("content");
    const analyzeEl = document.getElementById("analyze");
    const pasteEl = document.getElementById("paste");
    const clearEl = document.getElementById("clear");
    const copyEl = document.getElementById("copy");
    const shareEl = document.getElementById("share");
    const saveEndpointEl = document.getElementById("save-endpoint");
    const statusEl = document.getElementById("status");
    const hintTextEl = document.getElementById("hintText");
    const endpointPanelEl = document.getElementById("endpointPanel");
    const contentPanelEl = document.getElementById("contentPanel");
    const resultEl = document.getElementById("result");
    const summaryTextEl = document.getElementById("summaryText");
    const keyPointsTextEl = document.getElementById("keyPointsText");
    const actionItemsTextEl = document.getElementById("actionItemsText");

    function setStatus(text, isError) {
      statusEl.textContent = text;
      statusEl.className = "status " + (isError ? "err" : "ok");
    }

    function setResult(summary, keyPoints, actionItems) {
      summaryTextEl.textContent = (summary || "-").trim() || "-";
      keyPointsTextEl.textContent = (keyPoints || "-").trim() || "-";
      actionItemsTextEl.textContent = (actionItems || "-").trim() || "-";
    }

    function clearResult() {
      setResult("-", "-", "-");
    }

    function hasResultData() {
      return (
        summaryTextEl.textContent.trim() !== "-" ||
        keyPointsTextEl.textContent.trim() !== "-" ||
        actionItemsTextEl.textContent.trim() !== "-"
      );
    }

    function resultAsText() {
      return (
        "Summary: " + summaryTextEl.textContent.trim() + "\n" +
        "KeyPoints: " + keyPointsTextEl.textContent.trim() + "\n" +
        "ActionItems: " + actionItemsTextEl.textContent.trim()
      );
    }

    function endpointFromQuery() {
      const params = new URLSearchParams(window.location.search);
      return (params.get("endpoint") || "").trim();
    }

    function hasEndpointQueryOverride() {
      return !!endpointFromQuery();
    }

    function isSharedMode() {
      const params = new URLSearchParams(window.location.search);
      return params.get("shared") === "1";
    }

    function applySharedModeUi() {
      endpointPanelEl.style.display = "none";
      contentPanelEl.style.display = "none";
      hintTextEl.textContent = "Shared content received. Running analysis and returning HTML output.";
    }

    function isGitHubPagesHost() {
      const host = String(window.location.hostname || "").toLowerCase();
      return host.endsWith(".github.io");
    }

    function normalizeBaseUrl(value) {
      const text = String(value || "").trim();
      if (!text) {
        return "";
      }
      return text.replace(/\/+$/, "");
    }

    function endpointFromBase(base) {
      const normalized = normalizeBaseUrl(base);
      if (!normalized) {
        return "";
      }
      return normalized + "/analyze";
    }

    async function endpointFromConfig(forceRefresh) {
      const force = !!forceRefresh;
      if (!force && cachedConfigEndpoint && (Date.now() - cachedConfigLoadedAt) < CONFIG_CACHE_TTL_MS) {
        return cachedConfigEndpoint;
      }
      const candidates = [
        new URL(CONFIG_PATH, window.location.href).toString(),
        new URL("tower.config.json", window.location.href).toString(),
        new URL("/PhoneEval/tower.config.json", window.location.origin).toString(),
        new URL("/tower.config.json", window.location.origin).toString(),
      ];
      const seen = new Set();
      const uniqueCandidates = candidates.filter((url) => {
        if (seen.has(url)) {
          return false;
        }
        seen.add(url);
        return true;
      });
      for (const configUrl of uniqueCandidates) {
        try {
          const response = await fetch(configUrl, { cache: "no-store" });
          if (!response.ok) {
            continue;
          }
          const config = await response.json();
          const base = endpointFromBase(config && config.towerBaseUrl);
          if (base) {
            cachedConfigEndpoint = base;
            cachedConfigLoadedAt = Date.now();
            return cachedConfigEndpoint;
          }
        } catch (_) {
          // Try next config candidate.
        }
      }
      return "";
    }

    function endpointFromOrigin() {
      const origin = normalizeBaseUrl(window.location.origin);
      if (!origin) {
        return "";
      }
      if (!isGitHubPagesHost()) {
        return origin + "/analyze";
      }
      return "";
    }

    async function analyzeAtEndpoint(endpoint, text) {
      const res = await fetch(endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: text })
      });
      const raw = await res.text();
      const contentType = String(res.headers.get("Content-Type") || "").toLowerCase();
      if (contentType.indexOf("application/json") === -1) {
        const preview = String(raw || "").replace(/\s+/g, " ").trim().slice(0, 140);
        throw new Error(
          "Non-JSON response (HTTP " + res.status + ", " + (contentType || "unknown type") + "): " +
          (preview || "empty body")
        );
      }
      let data = null;
      try {
        data = raw ? JSON.parse(raw) : null;
      } catch (_) {
        throw new Error("Invalid JSON response (HTTP " + res.status + ")");
      }
      if (!res.ok || (data && data.error)) {
        throw new Error((data && data.error) || ("HTTP " + res.status));
      }
      if (!data || typeof data !== "object") {
        throw new Error("Empty response from endpoint");
      }
      return data;
    }

    async function loadEndpoint() {
      const fromQuery = endpointFromQuery();
      if (fromQuery) {
        endpointEl.value = fromQuery;
        return;
      }
      if (isGitHubPagesHost()) {
        const fromConfig = await endpointFromConfig(true);
        if (fromConfig) {
          endpointEl.value = fromConfig;
          return;
        }
      }
      const pinned = localStorage.getItem(ENDPOINT_PINNED_KEY) === "1";
      const fromStorage = (localStorage.getItem(ENDPOINT_KEY) || "").trim();
      if (pinned && fromStorage) {
        endpointEl.value = fromStorage;
        return;
      }
      const fromOrigin = endpointFromOrigin();
      if (fromOrigin) {
        endpointEl.value = fromOrigin;
        return;
      }
      endpointEl.value = "";
    }

    function formatResult(data) {
      const summary = (data.summary || "-").trim();
      const keyPoints = (data.key_points || "-").trim();
      const actionItems = (data.action_items || "-").trim();
      return {
        summary: summary,
        keyPoints: keyPoints,
        actionItems: actionItems
      };
    }

    async function loadSharedTextIfPresent() {
      const params = new URLSearchParams(window.location.search);
      if (params.get("shared") !== "1") {
        return false;
      }
      try {
        const res = await fetch("./shared-data", { cache: "no-store" });
        if (!res.ok) {
          setStatus("Status: shared content not available", true);
          return false;
        }
        const text = (await res.text()).trim();
        if (!text) {
          setStatus("Status: shared content is empty", true);
          return false;
        }
        contentEl.value = text;
        setStatus("Status: shared content loaded", false);
        return true;
      } catch (err) {
        setStatus("Status: failed to load shared content", true);
        return false;
      }
    }

    async function analyze() {
      let endpoint = endpointEl.value.trim();
      const text = contentEl.value.trim();
      if (isGitHubPagesHost() && !hasEndpointQueryOverride()) {
        const fromConfig = await endpointFromConfig(true);
        if (fromConfig) {
          endpoint = fromConfig;
          endpointEl.value = fromConfig;
        }
      }
      if (!endpoint) {
        setStatus("Status: endpoint is required", true);
        return;
      }
      try {
        const endpointUrl = new URL(endpoint);
        const path = String(endpointUrl.pathname || "").toLowerCase();
        if (path !== "/analyze") {
          setStatus("Status: endpoint must be exact /analyze URL", true);
          return;
        }
      } catch (_) {
        setStatus("Status: endpoint must be valid absolute URL", true);
        return;
      }
      if (!text) {
        setStatus("Status: text is required", true);
        return;
      }

      analyzeEl.disabled = true;
      setStatus("Status: analyzing...", false);
      try {
        let data = null;
        try {
          data = await analyzeAtEndpoint(endpoint, text);
        } catch (firstErr) {
          const firstMessage = (firstErr && firstErr.message) ? firstErr.message : "";
          if (isGitHubPagesHost() && !hasEndpointQueryOverride() && /failed to fetch/i.test(firstMessage)) {
            const refreshed = await endpointFromConfig(true);
            if (refreshed && refreshed !== endpoint) {
              endpoint = refreshed;
              endpointEl.value = refreshed;
              data = await analyzeAtEndpoint(endpoint, text);
            } else {
              throw firstErr;
            }
          } else {
            throw firstErr;
          }
        }
        const result = formatResult(data);
        setResult(result.summary, result.keyPoints, result.actionItems);
        setStatus("Status: success", false);
      } catch (err) {
        clearResult();
        setStatus("Status: " + ((err && err.message) ? err.message : "analyze failed"), true);
      } finally {
        analyzeEl.disabled = false;
      }
    }

    async function pasteText() {
      try {
        const text = await navigator.clipboard.readText();
        if (!text.trim()) {
          setStatus("Status: clipboard is empty", true);
          return;
        }
        contentEl.value = text;
        setStatus("Status: pasted from clipboard", false);
      } catch (err) {
        setStatus("Status: clipboard read blocked", true);
      }
    }

    function clearAll() {
      contentEl.value = "";
      clearResult();
      setStatus("Status: cleared", false);
    }

    async function copyResult() {
      if (!hasResultData()) {
        setStatus("Status: nothing to copy", true);
        return;
      }
      try {
        const text = resultAsText();
        await navigator.clipboard.writeText(text);
        setStatus("Status: result copied", false);
      } catch (err) {
        setStatus("Status: copy blocked", true);
      }
    }

    async function shareResult() {
      if (!navigator.share) {
        setStatus("Status: system share not supported", true);
        return;
      }
      if (!hasResultData()) {
        setStatus("Status: nothing to share", true);
        return;
      }
      try {
        const text = resultAsText();
        await navigator.share({
          title: "PhoneEval Result",
          text: text
        });
        setStatus("Status: result shared", false);
      } catch (err) {
        setStatus("Status: share cancelled", true);
      }
    }

    function saveEndpoint() {
      const endpoint = endpointEl.value.trim();
      if (!endpoint) {
        setStatus("Status: endpoint is required", true);
        return;
      }
      try {
        const endpointUrl = new URL(endpoint);
        const path = String(endpointUrl.pathname || "").toLowerCase();
        if (path !== "/analyze") {
          setStatus("Status: endpoint must be exact /analyze URL", true);
          return;
        }
      } catch (_) {
        setStatus("Status: endpoint must be valid absolute URL", true);
        return;
      }
      localStorage.setItem(ENDPOINT_KEY, endpoint);
      localStorage.setItem(ENDPOINT_PINNED_KEY, "1");
      setStatus("Status: endpoint saved", false);
    }

    function registerServiceWorker() {
      if (!("serviceWorker" in navigator)) {
        return;
      }
      navigator.serviceWorker.register("./sw.js").catch(function () {
        setStatus("Status: service worker registration failed", true);
      });
    }

    analyzeEl.addEventListener("click", analyze);
    pasteEl.addEventListener("click", pasteText);
    clearEl.addEventListener("click", clearAll);
    copyEl.addEventListener("click", copyResult);
    shareEl.addEventListener("click", shareResult);
    saveEndpointEl.addEventListener("click", saveEndpoint);

    async function init() {
      await loadEndpoint();
      registerServiceWorker();
      if (isSharedMode()) {
        applySharedModeUi();
      }
      const sharedLoaded = await loadSharedTextIfPresent();
      if (sharedLoaded) {
        await analyze();
      }
    }

    init();
  </script>
</body>
</html>
