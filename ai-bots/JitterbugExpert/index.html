<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jitterbug Expert</title>
  <style>
    :root {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background-color: #070711;
      color: #e5f8ff;
      
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem;
      background-color: #04040a;
      background-image: url("../../../Images/JBBG.png");
      background-size: 55% 75%;
      background-position: center;
      background-repeat: no-repeat;
      position: relative;
      isolation: isolate;
    }

    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at top, rgba(7, 8, 20, 0.85), rgba(7, 7, 17, 0.95)),
        radial-gradient(circle at 25% 20%, rgba(110, 242, 232, 0.35), transparent 55%);
      pointer-events: none;
      z-index: 0;
    }

    main.landing-card {
      position: relative;
      z-index: 1;
    }

    .landing-card {
      width: min(540px, 90vw);
      padding: 2.5rem;
      border-radius: 16px;
      text-align: center;
      background: rgba(7, 9, 22, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.55), inset 0 0 30px rgba(110, 242, 232, 0.15);
      backdrop-filter: blur(12px);
    }

    .landing-card h1 {
      margin: 0 0 1rem;
      font-size: clamp(2.5rem, 4vw, 3.5rem);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .landing-card p {
      margin: 0;
      color: #a3c6ff;
      font-size: 1rem;
      line-height: 1.6;
    }

    .accent {
      color: #6ef2e8;
    }
  </style>
</head>
<body>
  <main class="landing-card">
    <h1>Welcome to the Jitterbug Expert</h1>
    <p>
      We're spinning up something special. Check back soon for the AI-powered
      expertise and art of the jitterbug delivered directly to your screen.
      For now, take a breath and enjoy the glow.
    </p>
  </main>
</body>
</html>
