<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jitterbug Expert</title>
  <style>
    :root {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background-color: #030409;
      color: #faebd7;
    }

    * {
      box-sizing: border-box;
      forced-color-adjust: none;
      -ms-high-contrast-adjust: none;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 5rem 3rem 3rem;
      background-color: #030409;
      background-image: url("../../Images/JBBG.png");
      background-size: 60% 80%;
      background-position: center;
      background-repeat: no-repeat;
      position: relative;
    }

    @media (max-width: 640px) {
      body {
        padding: 3rem 1.25rem 2rem;
        align-items: center;
      }
      .landing-card {
        width: calc(100vw - 2rem);
        padding: 2rem;
      }
      .landing-card h1 {
        font-size: clamp(1.9rem, 8vw, 2.5rem);
      }
      .landing-card p {
        font-size: 1rem;
        line-height: 1.5;
      }
    }

    body::after {
      content: "";
      position: absolute;
      top: 1rem;
      left: 1rem;
      width: 150px;
      height: 150px;
      background: url("../../Images/NOai.png") center/cover no-repeat;
      filter: brightness(0.75);
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.6);
      border-radius: 18px;
      opacity: 0.95;
    }

    .landing-card {
      margin-top: 20px;
      position: relative;
      width: min(540px, 90vw);
      padding: 2.5rem;
      border-radius: 12px;
      text-align: center;
      background: rgba(5, 6, 13, 0.52);
      border: 1px solid rgba(255, 235, 215, 0.25);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
      overflow: hidden;
      backdrop-filter: blur(6px);
    }

    .landing-card::before {
      content: "";
      /* remove background overlay so image can be displayed separately */
      position: absolute;
      inset: 0;
      background: none;
    }

    .landing-card::after {
      content: "";
      position: absolute;
      top: 1rem;
      left: 1rem;
      width: 120px;
      height: 120px;

      filter: brightness(0.85);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55);
      border-radius: 12px;
      opacity: 0.95;
    }

    .landing-card h1,
    .landing-card p {
      position: relative;
      z-index: 2;
    }

    .landing-card h1 {
      margin: 0 0 1rem;
      font-size: clamp(2.3rem, 4vw, 3rem);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #faebd7;
    }

    .landing-card p {
      margin: 0;
      color: #faebd7;
      font-size: 1.1rem;
      line-height: 1.6;
    }

    .accent {
      color: #6ef2e8;
    }

    .help-button {
      position: absolute;
      top: 0.25rem;
      right: 0.25rem;
      padding: 4rem 8rem;
      border-radius: 48px;
      background: rgba(250, 235, 215, 0.35);
      color: #faebd7;
      border: 4px solid rgba(250, 235, 215, 0.75);
      text-transform: uppercase;
      letter-spacing: 0.4em;
      font-size: 2.5rem;
      font-weight: 900;
      text-decoration: none;
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(12px);
    }
  </style>
</head>
<body>
    <a class="help-button" href="/help">Help</a>
    <main class="landing-card">
      <h1>Welcome to the Jitterbug Expert</h1>
      <p>
      We're spinning up something special. Check back soon for the AI-powered
      expertise and art of the jitterbug delivered directly to your screen.
      For now, take a breath and enjoy the glow.
    </p>
  </main>
</body>
</html>
