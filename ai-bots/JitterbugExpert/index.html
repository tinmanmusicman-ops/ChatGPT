<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jitterbug Expert</title>
  <style>
    :root {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background-color: #030409;
      color: #faebd7;
    }

    * {
      box-sizing: border-box;
      forced-color-adjust: none;
      -ms-high-contrast-adjust: none;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem;
      background-color: #030409;
      background-image: url("BG.png");
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
    }

    .landing-card {
      width: min(540px, 90vw);
      padding: 2.5rem;
      border-radius: 12px;
      text-align: center;
      background: #05060d;
      border: 1px solid rgba(255, 235, 215, 0.25);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
    }

    .landing-card h1 {
      margin: 0 0 1rem;
      font-size: clamp(2.3rem, 4vw, 3rem);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #faebd7;
    }

    .landing-card p {
      margin: 0;
      color: #faebd7;
      font-size: 1.1rem;
      line-height: 1.6;
    }

    .accent {
      color: #6ef2e8;
    }
  </style>
</head>
<body>
  <main class="landing-card">
    <h1>Welcome to the Jitterbug Expert</h1>
    <p>
      We're spinning up something special. Check back soon for the AI-powered
      expertise and art of the jitterbug delivered directly to your screen.
      For now, take a breath and enjoy the glow.
    </p>
  </main>
</body>
</html>
