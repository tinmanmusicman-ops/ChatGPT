<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jitterbug Expert</title>
  <style>
    :root {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background-color: #070711;
      color: #e5f8ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #1e1f5c, #070711 60%);
      padding: 1.5rem;
    }

    .landing-card {
      width: min(540px, 90vw);
      padding: 2.5rem;
      border-radius: 16px;
      text-align: center;
      background: rgba(11, 12, 31, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.45);
    }

    .landing-card h1 {
      margin: 0 0 1rem;
      font-size: clamp(2.5rem, 4vw, 3.5rem);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .landing-card p {
      margin: 0;
      color: #a3c6ff;
      font-size: 1rem;
      line-height: 1.6;
    }

    .accent {
      color: #6ef2e8;
    }
  </style>
</head>
<body>
  <main class="landing-card">
    <h1>Welcome to the Jitterbug Expert</h1>
    <p>
      We're spinning up something special. Check back soon for the AI-powered
      expertise and art of the jitterbug delivered directly to your screen.
      For now, take a breath and enjoy the glow.
    </p>
  </main>
</body>
</html>
