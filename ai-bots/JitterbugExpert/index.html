<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jitterbug Expert</title>
  <style>
    :root {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background-color: #030409;
      color: #faebd7;
    }

    * {
      box-sizing: border-box;
      forced-color-adjust: none;
      -ms-high-contrast-adjust: none;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 5rem 3rem 3rem;
      background-color: #030409;
      background-image: url("../../Images/JBBG.png");
      background-size: 60% 80%;
      background-position: center;
      background-repeat: no-repeat;
      position: relative;
    }

    @media (max-width: 640px) {
      body {
        padding: 3rem 1.25rem 2rem;
        align-items: center;
      }
      .landing-card {
        width: calc(100vw - 2rem);
        padding: 2rem;
      }
      .landing-card h1 {
        font-size: clamp(1.9rem, 8vw, 2.5rem);
      }
      .landing-card p {
        font-size: 1rem;
        line-height: 1.5;
      }
    }

    body::after {
      content: "";
      position: absolute;
      top: 1rem;
      left: 1rem;
      width: 100px;
      height: 100px;
      background: url("../../Images/NOai.png") center/cover no-repeat;
      filter: brightness(0.75);
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.6);
      border-radius: 18px;
      opacity: 0.95;
    }

    .landing-card {
      margin-top: 20px;
      position: relative;
      width: min(540px, 90vw);
      padding: 2.5rem;
      border-radius: 12px;
      text-align: center;
      background: rgba(5, 6, 13, 0.52);
      border: 1px solid rgba(255, 235, 215, 0.25);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
      overflow: hidden;
      backdrop-filter: blur(6px);
    }

    .landing-card::before {
      content: "";
      /* remove background overlay so image can be displayed separately */
      position: absolute;
      inset: 0;
      background: none;
    }

    .landing-card::after {
      content: "";
      position: absolute;
      top: 1rem;
      left: 1rem;
      width: 120px;
      height: 120px;

      filter: brightness(0.85);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55);
      border-radius: 12px;
      opacity: 0.95;
    }

    .landing-card h1,
    .landing-card p {
      position: relative;
      z-index: 2;
    }

    .landing-card h1 {
      margin: 0 0 1rem;
      font-size: clamp(2.3rem, 4vw, 3rem);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #faebd7;
    }

    .landing-card p {
      margin: 0;
      color: #faebd7;
      font-size: 1.1rem;
      line-height: 1.6;
    }

    .accent {
      color: #6ef2e8;
    }

    .help-button {
      position: absolute;
      top: 0.25rem;
      right: 0.25rem;
      padding: 4rem 8rem;
      border-radius: 48px;
      background: rgba(250, 235, 215, 0.35);
      color: #faebd7;
      border: 4px solid rgba(250, 235, 215, 0.75);
      text-transform: uppercase;
      letter-spacing: 0.4em;
      font-size: 3.6rem;
      font-weight: 900;
      text-decoration: none;
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(12px);
    }

    @media (max-width: 640px) {
      .help-button {
        padding: 1.5rem 3rem;
        font-size: 1.2rem;
        letter-spacing: 0.15em;
        border-width: 2px;
        top: 0.5rem;
        right: 0.5rem;
      }
    }
  </style>
</head>
<body>
    <a class="help-button" href="#" role="button">Help</a>
    <main class="landing-card">
      <h1>Welcome to the Jitterbug Expert</h1>
      <p>
      We're spinning up something special. Check back soon for the AI-powered
      expertise and art of the jitterbug delivered directly to your screen.
      For now, take a breath and enjoy the glow.
    </p>
    </main>
    <script>
      (function () {
        const helpButton = document.querySelector(".help-button");
        if (!helpButton) {
          return;
        }

        const configCandidates = [
          "/tower.config.json",
          "tower.config.json",
          "../tower.config.json",
        ];
        let cachedBaseUrl = "";

        async function resolveTunnelBaseUrl() {
          if (cachedBaseUrl) {
            return cachedBaseUrl;
          }
          for (const path of configCandidates) {
            try {
              const response = await fetch(path, { cache: "no-store" });
              if (!response.ok) {
                continue;
              }
              const config = await response.json();
              const base = (config && config.towerBaseUrl) || "";
              if (base) {
                cachedBaseUrl = base.replace(/\/+$/, "");
                return cachedBaseUrl;
              }
            } catch (_) {
              // ignore and try next candidate
            }
          }
          const manual = window.prompt(
            "Enter the active Cloudflare tunnel URL (https://...) so we can deliver help."
          );
          if (manual) {
            cachedBaseUrl = manual.trim().replace(/\/+$/, "");
            return cachedBaseUrl;
          }
          return "";
        }

        async function requestHelpPayload() {
          const prompts = [
            { key: "name", label: "Full name" },
            { key: "phone", label: "Phone number" },
            { key: "email", label: "Email address" },
            {
              key: "device",
              label: "Device you are using (e.g., iPhone, laptop, tablet)",
              default: navigator.platform || navigator.userAgent || "unknown",
            },
            {
              key: "message",
              label: "Message or issue details",
            },
          ];

          const payload = {};
          for (const field of prompts) {
            const hint = field.default ? ` (default: ${field.default})` : "";
            const response = window.prompt(`${field.label}${hint}`);
            if (response === null) {
              return null;
            }
            const trimmed = response.trim();
            if (!trimmed && !field.default) {
              window.alert(`${field.label} is required.`);
              return null;
            }
            payload[field.key] = trimmed || field.default || "";
          }
          return payload;
        }

        async function submitHelpRequest() {
          helpButton.setAttribute("aria-busy", "true");
          helpButton.setAttribute("disabled", "true");
          helpButton.style.pointerEvents = "none";
          try {
            const baseUrl = await resolveTunnelBaseUrl();
            if (!baseUrl) {
              window.alert("Unable to determine the tunnel URL. Please provide it manually.");
              return;
            }
            const payload = await requestHelpPayload();
            if (!payload) {
              return;
            }
            const url = `${baseUrl}/help`;
            const response = await fetch(url, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify(payload),
            });
            if (!response.ok) {
              const errorText = await response.text();
              window.alert(`Help request failed (${response.status}): ${errorText}`);
              return;
            }
            const result = await response.json().catch(() => ({}));
            window.alert(`Help request received. Reference ${result.accountId || "saved"}.`);
          } catch (error) {
            console.error("help request failed", error);
            window.alert("Help request failed; please try again.");
          } finally {
            helpButton.removeAttribute("aria-busy");
            helpButton.removeAttribute("disabled");
            helpButton.style.pointerEvents = "";
          }
        }

        helpButton.addEventListener("click", function (event) {
          event.preventDefault();
          submitHelpRequest();
        });
      })();
    </script>
</body>
</html>
