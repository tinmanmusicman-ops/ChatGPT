<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CORE Display</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <style>
    :root {
      color-scheme: dark;
      forced-color-adjust: none;
  -ms-high-contrast-adjust: none;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 20% 20%, #1b2b2c, #050505 60%);
      font-family: "Space Mono", "Inconsolata", "Inter", system-ui, sans-serif;
      color: #8cffd5;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
      flex-direction: column;
      gap: 24px;
    }

    .controls {
      width: min(620px, 100%);
      display: flex;
      justify-content: center;
    }

    .control-input {
      flex: 1;
      padding: 14px 18px;
      border-radius: 28px 0 0 28px;
      border: 1px solid rgba(143, 255, 214, 0.6);
      background: rgba(15, 27, 22, 0.95);
      color: #f4fff8;
      font-size: 1.15rem;
      outline: none;
    }

    .control-button {
      padding: 14px 22px;
      border-radius: 0 28px 28px 0;
      border: 1px solid rgba(143, 255, 214, 0.6);
      border-left: none;
      background: rgba(143, 255, 214, 0.1);
      color: #9fffdc;
      font-size: 1.15rem;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .control-button:hover {
      background: rgba(143, 255, 214, 0.25);
    }

    .controls small {
      margin-left: 12px;
      align-self: center;
      color: #7bedc8;
      letter-spacing: 0.3em;
    }

    .crt-shell {
      width: min(1160px, 95vw);
      height: min(860px, 90vh);
      border-radius: 36px;
      border: 6px solid rgba(240, 217, 171, 0.7);
      background: linear-gradient(180deg, rgba(8, 32, 24, 0.9), rgba(1, 10, 8, 0.9));
      box-shadow:
        0 30px 60px rgba(0, 0, 0, 0.6),
        inset 0 0 40px rgba(87, 255, 209, 0.35),
        0 0 18px rgba(87, 255, 209, 0.8);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .crt-shell::before {
      content: "";
      position: absolute;
      inset: 20px;
      border-radius: 22px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      pointer-events: none;
    }

    .crt-screen {
      margin-top: 150px;
      width: calc(100% - 120px);
      height: calc(100% - 90px);
      position: relative;
      background: linear-gradient(180deg, #030a04 0%, #050100 50%, #010400 100%);
      border-radius: 24px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
      text-align: left;
      padding: 24px;
      box-shadow: inset 0 0 60px rgba(0, 0, 0, 0.8);
      gap: 6px;
    }

    .crt-screen::before {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        rgba(255, 255, 255, 0.04),
        rgba(255, 255, 255, 0.04) 1px,
        transparent 1px,
        transparent 2px
      );
      opacity: 0.35;
      mix-blend-mode: screen;
      pointer-events: none;
    }

    .crt-glow {
      position: absolute;
      inset: 6%;
      background: radial-gradient(circle, rgba(56, 113, 92, 0.5), transparent 60%);
      filter: blur(100px);
    }

    .crt-text {
      position: relative;
      z-index: 1;
      font-size: 1.35rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: #a5dca1;
      text-shadow:
        0 0 18px rgba(182, 213, 180, 0.9),
        0 0 32px rgba(78, 255, 130, 0.45);
      text-align: left;
      transition: color 0.35s ease, text-shadow 0.35s ease;
    }

    .crt-line {
      display: flex;
      gap: 0.65rem;
      align-items: baseline;
    }

    .crt-line:first-of-type {
      margin-top: 44px;
    }

    .crt-label {
      color: #54af6f;
      letter-spacing: 0.45em;
    }

    .crt-value {
      color: #83e243;
      letter-spacing: 0.35em;
    }
    .crt-version {
      position: absolute;
      margin-top: 10px;
      top: 1px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      font-size: 1.3rem;
      letter-spacing: 0.55rem;
      text-transform: uppercase;
      color: rgba(122, 246, 208, 0.9);
    }

    .crt-location,
    .crt-contact {
      position: relative;
      z-index: 1;
      font-size: 1rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      text-shadow: 0 0 12px rgba(122, 246, 208, 0.7);
      color: #7af6d0;
    }

    .crt-contact {
      margin-top: 0.4rem;
    }
    .field-hidden {
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    .crt-status {
      position: relative;
      z-index: 1;
      margin-top: 1rem;
      font-size: 1rem;
      letter-spacing: 0.5em;
      color: #74ffb2;
      transition: color 0.35s ease;
    }

    .crt-input-prompt {
      position: relative;
      width: 100%;
      margin-top: 8px;
      font-size: 0.8rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: rgba(113, 252, 226, 0.85);
      opacity: 0;
      height: 20px;
      overflow: hidden;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: opacity 0.3s ease;
    }

    .crt-input-prompt.visible {
      opacity: 1;
    }

    .crt-input-prompt span {
      display: inline-block;
      width: 10px;
      height: 16px;
      animation: cursor-blink 1s steps(1) infinite;
    }

    @keyframes cursor-blink {
      0%,
      50% {
        opacity: 1;
      }
      51%,
      100% {
        opacity: 0;
      }
    }

    .crt-placeholder {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      font-size: 0.95rem;
      letter-spacing: 0.45em;
      text-transform: uppercase;
      color: rgba(189, 253, 184, 0.92);
      z-index: 1;
      line-height: 1.2;
    }

    .crt-placeholder.hidden {
      display: none;
    }

    .crt-placeholder-line {
      color: #65f08f;
    }

    .speed-selector {
      position: absolute;
      top: 1px;
      right: 24px;
      display: flex;
      gap: 3px;
      flex-wrap: wrap;
      justify-content: flex-end;
      z-index: 3;
    }

    .speed-selector label {
      display: block;
      width: 110px;
      height: 42px;
      position: relative;
      overflow: hidden;
      border-radius: 8px;
      cursor: pointer;
    }

    .speed-selector input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .speed-selector span {
      display: flex;
      width: 100%;
      height: 100%;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      border: 1px solid rgba(122, 246, 208, 0.35);
      background: rgba(2, 6, 3, 0.95);
      color: #7af6d0;
      letter-spacing: 0.3em;
      font-size: 0.7rem;
      text-transform: uppercase;
      transition: background 0.2s ease, color 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    .speed-selector span::after {
      content: "";
      position: absolute;
      inset: 6px;
      border-radius: 6px;
      border: 1px solid rgba(122, 246, 208, 0.2);
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .speed-selector input:checked + span {
      background: linear-gradient(180deg, rgba(122, 246, 208, 0.2), rgba(78, 255, 130, 0.25));
      color: #adff37;
      box-shadow: inset 0 0 10px rgba(122, 246, 208, 0.35);
    }

    .speed-selector input:checked + span::after {
      opacity: 1;
    }

    .crt-options {
      position: absolute;
      bottom: 30px;
      left: 32px;
      right: 32px;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      align-items: flex-start;
      z-index: 4;
      pointer-events: none;
    }

    .cores-prompt {
      font-size: 0.85rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: #6effc7;
      margin: 0;
      pointer-events: none;
    }

    .cores-option-buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      pointer-events: auto;
    }

    .cores-option-button {
      flex: 1;
      min-width: 180px;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid rgba(122, 246, 208, 0.5);
      background: rgba(2, 6, 3, 0.9);
      color: #7af6d0;
      font-size: 0.75rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s ease, border 0.2s ease;
    }

    .cores-option-button:hover {
      background: rgba(122, 246, 208, 0.1);
      border-color: rgba(122, 246, 208, 0.85);
    }

    .cores-popup-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 24px;
    }

    .cores-popup-overlay.visible {
      display: flex;
    }

    .cores-popup {
      width: min(1080px, 90vw);
      max-height: 82vh;
      background: rgba(4, 10, 5, 0.95);
      border-radius: 20px;
      border: 1px solid rgba(173, 255, 55, 0.6);
      box-shadow:
        0 0 60px rgba(10, 255, 154, 0.2),
        0 0 8px rgba(0, 0, 0, 0.9);
      padding: 24px;
      overflow-y: auto;
      position: relative;
    }

    .cores-popup h2 {
      margin: 0 0 14px;
      color: #47be3a;
      font-size: 1.6rem;
      letter-spacing: 0.4em;
    }

    .cores-popup-close {
      position: absolute;
      top: 16px;
      right: 16px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(173, 255, 55, 0.5);
      color: #adff37;
      width: 32px;
      height: 32px;
      line-height: 32px;
      border-radius: 50%;
      font-size: 1.1rem;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .cores-popup-close:hover {
      transform: scale(1.08);
    }

    .cores-popup-content {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .cores-popup-section h3 {
      margin: 0 0 4px;
      font-size: 1.1rem;
      letter-spacing: 0.25em;
      color: #74ffb2;
      text-transform: uppercase;
    }

    .cores-popup-section {
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(173, 255, 55, 0.2);
    }

    .cores-popup-signals strong {
      font-size: 0.75rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: #7af6d0;
    }

    .cores-popup-signals ul {
      padding-left: 18px;
      margin: 8px 0 0;
      list-style: disc;
      color: #b9ffce;
      font-size: 0.85rem;
      line-height: 1.4;
    }

    .cores-popup-projects {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .cores-popup-project h4 {
      margin: 0 0 4px;
      color: #65f08f;
      letter-spacing: 0.3em;
      font-size: 0.95rem;
      text-transform: uppercase;
    }

    .cores-popup-project p {
      margin: 0;
      color: #9fffdc;
      line-height: 1.5;
      font-size: 0.85rem;
    }

    .cores-popup-project-summary {
      font-style: italic;
      opacity: 0.9;
    }

    .cores-popup-project ul {
      margin: 6px 0;
      padding-left: 20px;
      color: #caffd9;
      line-height: 1.5;
      letter-spacing: 0.2em;
    }

    @media (max-width: 900px) {
      .speed-selector {
        position: static;
        width: 100%;
        justify-content: flex-start;
        margin-top: 6px;
      }

      .speed-selector label {
        width: auto;
        min-width: 94px;
        height: 36px;
      }

      .speed-selector span {
        font-size: 0.62rem;
        letter-spacing: 0.2em;
        padding: 0 8px;
      }
    }

  </style>
</head>
<body>
  <div class="controls">
    <form id="coresForm" autocomplete="off">
      <input id="coresIdInput" class="control-input" type="text" placeholder="Enter CORE ID (e.g. CORE-US-2026-000001)" />
      <button type="submit" class="control-button">Load</button>
    </form>
    <small>Retro CORE Console</small>
  </div>

      <div class="crt-shell">
            <div class="crt-version">CORES-VERSION: 1.0</div>
        <div class="crt-screen">

          <div class="crt-glow"></div>
          <div class="crt-placeholder" id="coresPlaceholder">
            <div class="crt-placeholder-line">Loading CORE data?</div>
            <div class="crt-placeholder-line">Location: unknown</div>
            <div class="crt-placeholder-line">Email: unknown</div>
            <div class="crt-placeholder-line">Phone: unknown</div>
          </div>
          <div class="speed-selector" aria-label="Select transmission speed">
            <label>
          <input type="radio" name="speed" value="rs232" checked />
          <span>RS-232</span>
        </label>
        <label>
          <input type="radio" name="speed" value="rs422" />
          <span>RS-422</span>
        </label>
        <label>
          <input type="radio" name="speed" value="usb2" />
          <span>USB 2</span>
        </label>
      </div>
      <div class="crt-line field-hidden" id="coresNameLine">
        <span class="crt-label">Name:</span>
        <span class="crt-value" id="coresName"></span>
      </div>
      <div class="crt-line field-hidden" id="coresLocationLine">
        <span class="crt-label">Location:</span>
        <span class="crt-value" id="coresLocation"></span>
      </div>
      <div class="crt-line field-hidden" id="coresEmailLine">
        <span class="crt-label">Email:</span>
        <span class="crt-value" id="coresEmail"></span>
      </div>
      <div class="crt-line field-hidden" id="coresPhoneLine">
        <span class="crt-label">Phone:</span>
        <span class="crt-value" id="coresPhone"></span>
      </div>
      <div class="crt-line field-hidden" id="coresAvailabilityLine">
        <span class="crt-label">Availability:</span>
        <span class="crt-value" id="coresAvailability"></span>
      </div>
      <div class="crt-line field-hidden" id="coresLuLine">
        <span class="crt-label" id="coresLuLabel">LU:</span>
        <span class="crt-value" id="coresLu"></span>
      </div>
      <div class="crt-status" id="coresStatus">ID: waiting</div>
      <div class="crt-input-prompt" id="coresInputPrompt">
        <span>|</span>Ready. Press 1 (summary), 2 (deep), 3 (skills), or 4 (pdf)
      </div>
      <div class="crt-options" role="group" aria-label="CORE review prompt">
        <p class="cores-prompt"> </p>
        <div class="cores-option-buttons">
          <button type="button" class="cores-option-button" data-mode="summary">Summary (1)</button>
          <button type="button" class="cores-option-button" data-mode="deep">Deep (2)</button>
          <button type="button" class="cores-option-button" data-mode="skills">Skills (3)</button>
          <button type="button" class="cores-option-button" data-mode="pdf">PDF (4)</button>
        </div>
      </div>
    </div>
  </div>

  <div class="cores-popup-overlay" id="coresPopupOverlay" aria-hidden="true">
    <div class="cores-popup" role="dialog" aria-modal="true" aria-labelledby="coresPopupTitle">
      <button type="button" class="cores-popup-close" aria-label="Close review window">&times;</button>
      <h2 id="coresPopupTitle">Work History Review</h2>
      <div class="cores-popup-content" id="coresPopupContent"></div>
    </div>
  </div>

  
 
  <script>
    (function () {
      const formEl = document.getElementById("coresForm");
      const inputEl = document.getElementById("coresIdInput");
      const coresNameEl = document.getElementById("coresName");
      const coresLocationEl = document.getElementById("coresLocation");
      const coresEmailEl = document.getElementById("coresEmail");
      const coresPhoneEl = document.getElementById("coresPhone");
      const coresAvailabilityEl = document.getElementById("coresAvailability");
      const coresLuEl = document.getElementById("coresLu");
      const coresNameLine = document.getElementById("coresNameLine");
      const coresLocationLine = document.getElementById("coresLocationLine");
      const coresEmailLine = document.getElementById("coresEmailLine");
      const coresPhoneLine = document.getElementById("coresPhoneLine");
      const coresAvailabilityLine = document.getElementById("coresAvailabilityLine");
      const coresLuLine = document.getElementById("coresLuLine");
      const coresLuLabel = document.getElementById("coresLuLabel");
      const coresStatusEl = document.getElementById("coresStatus");
      const DEFAULT_CORE_ID = "CORE-US-2026-000001";
      let towerConfigPromise = null;

      const SPEED_CONFIG = {
        rs232: 28,
        rs422: 14,
        usb2: 0,
      };
      let currentSpeedDelay = SPEED_CONFIG.rs232;
      const popupOverlayEl = document.getElementById("coresPopupOverlay");
      const popupContentEl = document.getElementById("coresPopupContent");
      const popupTitleEl = document.getElementById("coresPopupTitle");
      const popupCloseButton = document.querySelector(".cores-popup-close");
      const optionButtons = document.querySelectorAll(".cores-option-button");
      const coresPlaceholderEl = document.getElementById("coresPlaceholder");
      const coresInputPromptEl = document.getElementById("coresInputPrompt");
      let experienceData = [];
      let skillList = [];
      let promptActive = false;
      let loadedCoreId = "";

      const setStatus = (text, isError = false) => {
        if (!coresStatusEl) return;
        coresStatusEl.textContent = text;
        coresStatusEl.style.color = isError ? "#ff8a75" : "#6effc7";
      };

      const loadTowerBaseUrl = async () => {
        if (towerConfigPromise) return towerConfigPromise;
        towerConfigPromise = (async () => {
          const attempts = [
            "/tower.config.json",
            new URL("tower.config.json", window.location.href).toString(),
          ];
          for (const url of attempts) {
            try {
              const response = await fetch(url, { cache: "no-store" });
              if (!response.ok) continue;
              const json = await response.json();
              const base = String(json?.towerBaseUrl || "").trim();
              if (!base) continue;
              return base.replace(/\/+$/, "");
            } catch (error) {
              // Try the next location.
            }
          }
          return null;
        })();
        return towerConfigPromise;
      };

      const resolveCoreResourceUrls = async (id, extension) => {
        const encodedId = encodeURIComponent(id);
        const base = await loadTowerBaseUrl();
        const endpoints = [];
        if (base) {
          endpoints.push(`${base}/CORES/${encodedId}.${extension}`);
        }
        endpoints.push(`/CORES/${encodedId}.${extension}`);
        endpoints.push(new URL(`${encodedId}.${extension}`, window.location.href).toString());
        endpoints.push(new URL(`CORES/${encodedId}.${extension}`, window.location.origin).toString());
        return [...new Set(endpoints)];
      };

      const fetchCoreMarkdown = async (id) => {
        const attempts = await resolveCoreResourceUrls(id, "md");
        let lastError = "";
        for (const endpoint of attempts) {
          try {
            const response = await fetch(endpoint, { cache: "no-store" });
            if (!response.ok) {
              lastError = `Fetch failed (${response.status})`;
              continue;
            }
            const markdown = await response.text();
            if (!markdown.trim()) {
              lastError = "Document empty";
              continue;
            }
            return markdown;
          } catch (error) {
            lastError = error?.message || "Network error";
          }
        }
        throw new Error(lastError || "Unable to load CORE markdown");
      };

      const triggerBlobDownload = (blob, filename) => {
        const objectUrl = URL.createObjectURL(blob);
        const anchor = document.createElement("a");
        anchor.href = objectUrl;
        anchor.download = filename;
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
        setTimeout(() => URL.revokeObjectURL(objectUrl), 1000);
      };

      const getActiveCoreId = () => loadedCoreId || (inputEl?.value || "").trim() || DEFAULT_CORE_ID;

      const downloadCorePdf = async (id) => {
        const attempts = await resolveCoreResourceUrls(id, "pdf");
        let lastError = "";
        for (const endpoint of attempts) {
          try {
            const response = await fetch(endpoint, { cache: "no-store" });
            if (!response.ok) {
              lastError = `PDF fetch failed (${response.status})`;
              continue;
            }
            const pdfBlob = await response.blob();
            if (!pdfBlob.size) {
              lastError = "PDF empty";
              continue;
            }
            triggerBlobDownload(pdfBlob, `${id}.pdf`);
            return;
          } catch (error) {
            lastError = error?.message || "PDF network error";
          }
        }
        throw new Error(lastError || "Unable to load CORE PDF");
      };

      const parseExperiences = (markdown) => {
        const companyRegex = /## COMPANY:\s*([^\n]+)\n([\s\S]*?)(?=(?:## COMPANY:)|$)/g;
        const experiences = [];
        let companyMatch;
        while ((companyMatch = companyRegex.exec(markdown)) !== null) {
          const company = companyMatch[1].trim();
          const body = companyMatch[2];
          const signalsMatch = body.match(/### SIGNALS:\s*([\s\S]*?)(?=(?:###|##|$))/);
          const signals = (signalsMatch?.[1] || "")
            .split(/\r?\n/)
            .map((line) => line.replace(/^[\-\*]\s*/, "").trim())
            .filter(Boolean);
          const projects = [];
          const projectRegex = /###\s*PROJECT:\s*([^\n]+)\n([\s\S]*?)(?=###\s*PROJECT:|## COMPANY:|$)/gi;
          let projectMatch;
          while ((projectMatch = projectRegex.exec(body)) !== null) {
            projects.push({
              title: projectMatch[1].trim(),
              body: projectMatch[2].trim(),
            });
          }
          experiences.push({ company, signals, projects });
        }
        return experiences;
      };

      const parseSkills = (markdown) => {
        const skillsMatch = markdown.match(/# SKILLS\s*([\s\S]*?)(?=(?:\n# |\n## |$))/);
        if (!skillsMatch) {
          return [];
        }
        return skillsMatch[1]
          .split(/\r?\n/)
          .map((line) => line.replace(/^[\-\*\u2022]\s*/, "").trim())
          .filter(Boolean);
      };

      const summarizeProjectBody = (body) => {
        if (!body) return "";
        const lines = body
          .split(/\r?\n/)
          .map((line) => line.trim())
          .filter(Boolean);
        return lines.slice(0, 2).join(" ");
      };

      const renderExperiencePopup = (mode) => {
        if (!popupOverlayEl || !popupContentEl) return;
        popupContentEl.innerHTML = "";
        if (mode === "skills") {
          if (popupTitleEl) {
            popupTitleEl.textContent = "Skills Deep Search";
          }
          const section = document.createElement("section");
          section.className = "cores-popup-section";
          const heading = document.createElement("h3");
          heading.textContent = "Skills";
          section.appendChild(heading);
          if (!skillList.length) {
            const emptyEl = document.createElement("p");
            emptyEl.textContent = "No skills listed in this CORE.";
            section.appendChild(emptyEl);
          } else {
            const skillsList = document.createElement("ul");
            skillsList.style.listStyleType = "disc";
            skillsList.style.paddingLeft = "18px";
            skillList.forEach((skill) => {
              const li = document.createElement("li");
              li.textContent = skill;
              skillsList.appendChild(li);
            });
            section.appendChild(skillsList);
          }
          popupContentEl.appendChild(section);
          popupOverlayEl.classList.add("visible");
          popupOverlayEl.setAttribute("aria-hidden", "false");
          return;
        }
        const label = mode === "deep" ? "Deep" : "Summary";
        if (popupTitleEl) {
          popupTitleEl.textContent = `Work History Review (${label})`;
        }
        if (!experienceData.length) {
          popupContentEl.innerHTML = `<p>No experience data available.</p>`;
        }
        experienceData.forEach((entry) => {
          const section = document.createElement("section");
          section.className = "cores-popup-section";
          const heading = document.createElement("h3");
          heading.textContent = entry.company;
          section.appendChild(heading);
          if (entry.signals.length) {
            const signalsWrapper = document.createElement("div");
            signalsWrapper.className = "cores-popup-signals";
            const signalsHeader = document.createElement("strong");
            signalsHeader.textContent = "Signals";
            const signalsList = document.createElement("ul");
            entry.signals.forEach((signal) => {
              const li = document.createElement("li");
              li.textContent = signal;
              signalsList.appendChild(li);
            });
            signalsWrapper.appendChild(signalsHeader);
            signalsWrapper.appendChild(signalsList);
            section.appendChild(signalsWrapper);
          }
          if (entry.projects.length) {
            const projectContainer = document.createElement("div");
            projectContainer.className = "cores-popup-projects";
            entry.projects.forEach((project) => {
              const projectEl = document.createElement("article");
              projectEl.className = "cores-popup-project";
              const projectTitle = document.createElement("h4");
              projectTitle.textContent = project.title;
              projectEl.appendChild(projectTitle);
              if (mode === "summary") {
                const summaryText = summarizeProjectBody(project.body);
                const summaryEl = document.createElement("p");
                summaryEl.className = "cores-popup-project-summary";
                summaryEl.textContent = summaryText || "(No summary available)";
                projectEl.appendChild(summaryEl);
              } else {
                const paragraphs = project.body
                  .split(/\n{2,}/)
                  .map((chunk) => chunk.trim())
                  .filter(Boolean);
                paragraphs.forEach((chunk) => {
                  const lines = chunk
                    .split(/\r?\n/)
                    .map((line) => line.trim())
                    .filter(Boolean);
                  let listEl = null;
                  const flushList = () => {
                    if (listEl) {
                      projectEl.appendChild(listEl);
                      listEl = null;
                    }
                  };
                  lines.forEach((line) => {
                    const bulletMatch = line.match(/^-+\s*(.+)$/);
                    if (bulletMatch) {
                      if (!listEl) {
                        listEl = document.createElement("ul");
                      }
                      const li = document.createElement("li");
                      li.textContent = bulletMatch[1];
                      listEl.appendChild(li);
                      return;
                    }
                    flushList();
                    const paragraphEl = document.createElement("p");
                    paragraphEl.textContent = line;
                    projectEl.appendChild(paragraphEl);
                  });
                  flushList();
                });
              }
              projectContainer.appendChild(projectEl);
            });
            section.appendChild(projectContainer);
          }
          popupContentEl.appendChild(section);
        });
        popupOverlayEl.classList.add("visible");
        popupOverlayEl.setAttribute("aria-hidden", "false");
      };

      const closePopup = () => {
        if (!popupOverlayEl) return;
        popupOverlayEl.classList.remove("visible");
        popupOverlayEl.setAttribute("aria-hidden", "true");
        if (popupContentEl) {
          popupContentEl.innerHTML = "";
        }
      };

      const showPlaceholder = () => {
        if (coresPlaceholderEl) {
          coresPlaceholderEl.classList.remove("hidden");
        }
      };

      const hidePlaceholder = () => {
        if (coresPlaceholderEl) {
          coresPlaceholderEl.classList.add("hidden");
        }
      };

      const showInputPrompt = () => {
        if (coresInputPromptEl) {
          coresInputPromptEl.classList.add("visible");
        }
        promptActive = true;
      };

      const hideInputPrompt = () => {
        if (coresInputPromptEl) {
          coresInputPromptEl.classList.remove("visible");
        }
        promptActive = false;
      };

      const resetFields = () => {
        hideInputPrompt();
        showPlaceholder();
        experienceData = [];
        skillList = [];
        [
          coresNameLine,
          coresLocationLine,
          coresEmailLine,
          coresPhoneLine,
          coresAvailabilityLine,
          coresLuLine,
        ].forEach((line) => {
          if (!line) return;
          line.classList.add("field-hidden");
        });
        [
          coresNameEl,
          coresLocationEl,
          coresEmailEl,
          coresPhoneEl,
          coresAvailabilityEl,
          coresLuEl,
        ].forEach((el) => {
          if (!el) return;
          el.textContent = "";
        });
        if (coresLuLabel) {
          coresLuLabel.textContent = "LU:";
        }
      };


      const typeWriter = (wrapper, el, text) =>
        new Promise((resolve) => {
          if (!wrapper || !el) {
            resolve();
            return;
          }
          wrapper.classList.remove("field-hidden");
          el.textContent = "";
          if (currentSpeedDelay <= 0) {
            el.textContent = text;
            resolve();
            return;
          }
          let idx = 0;
          const step = () => {
            if (idx >= text.length) {
              resolve();
              return;
            }
            el.textContent += text[idx++];
            setTimeout(step, currentSpeedDelay);
          };
          step();
        });

      const renderCoreFields = async (markdown) => {
        hidePlaceholder();
        const queue = [
          { wrapper: coresNameLine, valueEl: coresNameEl, label: "Name" },
          { wrapper: coresLocationLine, valueEl: coresLocationEl, label: "Location" },
          { wrapper: coresEmailLine, valueEl: coresEmailEl, label: "Email" },
          { wrapper: coresPhoneLine, valueEl: coresPhoneEl, label: "Phone" },
          { wrapper: coresAvailabilityLine, valueEl: coresAvailabilityEl, label: "Availability" },
          { wrapper: coresLuLine, valueEl: coresLuEl, label: "LU", labelEl: coresLuLabel },
        ];
        for (const field of queue) {
          if (!field.wrapper || !field.valueEl) {
            continue;
          }
          const pattern = new RegExp(`^${field.label}:\\s*(.+)$`, "m");
          const match = markdown.match(pattern);
          if (!match) {
            field.wrapper.classList.add("field-hidden");
            field.valueEl.textContent = "";
            continue;
          }
          const labelText = field.label === "LU" ? "Last Updated" : field.label;
          if (field.labelEl) {
            field.labelEl.textContent = `${labelText}:`;
          }
          await typeWriter(field.wrapper, field.valueEl, match[1].trim());
        }
        showInputPrompt();
      };

      const speedInputs = document.querySelectorAll(".speed-selector input[name=\"speed\"]");
      speedInputs.forEach((input) => {
        input.addEventListener("change", () => {
          if (input.checked) {
            currentSpeedDelay = SPEED_CONFIG[input.value] ?? SPEED_CONFIG.rs232;
          }
        });
      });

      optionButtons.forEach((button) => {
        button.addEventListener("click", async () => {
          const mode = String(button.dataset.mode || "summary").toLowerCase();
          if (mode === "pdf") {
            const id = getActiveCoreId();
            setStatus(`Generating PDF ${id}...`);
            try {
              await downloadCorePdf(id);
              setStatus(`Downloaded PDF ${id}`);
            } catch (error) {
              console.error("[CORES] pdf failed", error);
              setStatus(error.message || "PDF conversion failed", true);
            }
            return;
          }
          if (mode !== "skills" && !experienceData.length) {
            setStatus("Load a CORE before reviewing work history.", true);
            return;
          }
          renderExperiencePopup(mode);
        });
      });

      popupCloseButton?.addEventListener("click", closePopup);
      popupOverlayEl?.addEventListener("click", (event) => {
        if (event.target === popupOverlayEl) {
          closePopup();
        }
      });
      document.addEventListener("keydown", async (event) => {
        if (event.key === "Escape") {
          closePopup();
          return;
        }
        if (!promptActive) {
          return;
        }
        if (["1", "2", "3", "4"].includes(event.key)) {
          event.preventDefault();
          const mode =
            event.key === "4" ? "pdf" : event.key === "3" ? "skills" : event.key === "2" ? "deep" : "summary";
          if (mode === "pdf") {
            const id = getActiveCoreId();
            setStatus(`Generating PDF ${id}...`);
            try {
              await downloadCorePdf(id);
              setStatus(`Downloaded PDF ${id}`);
            } catch (error) {
              console.error("[CORES] pdf failed", error);
              setStatus(error.message || "PDF conversion failed", true);
            }
            return;
          }
          if (mode !== "skills" && !experienceData.length) {
            setStatus("Load a CORE before reviewing work history.", true);
            return;
          }
          renderExperiencePopup(mode);
        }
      });

      const handleLoad = async (event) => {
        event?.preventDefault();
        const id = (inputEl?.value || "").trim() || DEFAULT_CORE_ID;
        setStatus(`Loading ${id}...`);
        loadedCoreId = "";
        resetFields();
        try {
          const markdown = await fetchCoreMarkdown(id);
          skillList = parseSkills(markdown);
          experienceData = parseExperiences(markdown);
          await renderCoreFields(markdown);
          loadedCoreId = id;
          setStatus(`Loaded ${id}`);
        } catch (error) {
          console.error("[CORES] load failed", error);
          setStatus(error.message || "Load failed", true);
        }
      };

      formEl?.addEventListener("submit", handleLoad);

      document.addEventListener("DOMContentLoaded", () => {
        resetFields();
        setStatus("Press Load to fetch CORE");
        if (inputEl) {
          inputEl.value = DEFAULT_CORE_ID;
        }
      });
    })();
  </script>
</body>
</html>
