<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Live Temperature Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #f4f6ff;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    header {
      padding: 30px 40px;
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(6px);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .subtitle {
      margin-top: 6px;
      color: #9fb3c8;
      font-size: 14px;
    }

    main {
      padding: 40px;
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    .card {
      background: rgba(0,0,0,0.45);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-top: 15px;
    }

    .metric {
      background: rgba(25,25,35,0.7);
      padding: 16px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .metric-label {
      font-size: 13px;
      color: #a9b7c6;
      margin-bottom: 6px;
    }

    .metric-value {
      font-size: 22px;
      font-weight: 600;
      color: #4fd1c5;
    }

    .chart-wrap {
      height: 420px;
      margin-top: 20px;
      display: none;
    }

    button {
      background: #4fd1c5;
      color: #062925;
      border: none;
      padding: 12px 18px;
      border-radius: 30px;
      font-size: 14px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    button:hover {
      background: #7fe3d7;
    }

    footer {
      padding: 20px 40px;
      font-size: 12px;
      color: #93a4b6;
      text-align: center;
    }
  </style>
</head>
<body>

<header>
  <h1>Live Temperature Dashboard</h1>
  <div class="subtitle">Real-time snapshot & historical trend view</div>
</header>

<main>

  <div class="card">
    <h2>Current Snapshot</h2>
    <div class="grid">
      <div class="metric">
        <div class="metric-label">Temperature</div>
        <div class="metric-value">72°F</div>
      </div>
      <div class="metric">
        <div class="metric-label">Humidity</div>
        <div class="metric-value">41%</div>
      </div>
      <div class="metric">
        <div class="metric-label">System Status</div>
        <div class="metric-value">Normal</div>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>History</h2>
    <button onclick="toggleChart()">Show History Chart</button>

    <div class="chart-wrap" id="chartArea">
      <canvas id="historyChart"></canvas>
    </div>
  </div>

</main>

<footer>
  Secure local processing • Static presentation only • No sensitive data exposed
</footer>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
let chartVisible = false;

function toggleChart() {
  chartVisible = !chartVisible;
  const area = document.getElementById("chartArea");
  area.style.display = chartVisible ? "block" : "none";

  if (chartVisible && !window.tempChart) {
    const ctx = document.getElementById('historyChart').getContext('2d');
    window.tempChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: ["10:00","11:00","12:00","13:00","14:00","15:00"],
        datasets: [{
          label: "Temperature °F",
          data: [70,71,72,72,73,72],
          borderColor: "#4fd1c5",
          backgroundColor: "rgba(79,209,197,0.2)",
          tension: 0.3,
          fill: true
        }]
      },
      options: {
        maintainAspectRatio: false,
        animation: false,
        scales: {
          y: {
            min: 60,
            max: 90
          }
        }
      }
    });
  }
}
</script>

</body>
</html>
