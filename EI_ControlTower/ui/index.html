<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HSST Control Tower</title>
  <link rel="stylesheet" href="/tower/tower.css">
</head>

<body>
  <h1>HSST CONTROL TOWER</h1>

  <section id="job-pipeline">
    <h2>Job Pipeline</h2>
    <button id="import-job">Import Job</button>
    <button id="scam-check">Scam Check</button>
    <button id="enrich-company">Enrich Company</button>
    <button id="push-ss">Push to SS</button>
  </section>

  <section id="facility-panel">
    <h2>Facility Dashboard</h2>
    <button id="read-thermostat">Read Thermostat</button>
    <button id="open-dashboard">Open Dashboard</button>
    <button id="weather-sync">Weather Sync</button>
  </section>

  <section id="fax-engine">
    <h2>Fax Engine</h2>
    <button id="fax-queue">View Queue</button>
    <button id="fax-retry">Retry Failed</button>
    <button id="fax-log">Sent Log</button>
  </section>

  <section id="security">
    <h2>Security</h2>
    <button id="security-notify">Notify SS</button>
    <button id="security-log">View Log</button>
  </section>

  <section id="config">
    <h2>Config Manager</h2>
    <button id="config-load">Load Config</button>
    <button id="config-edit">Edit Config</button>
    <button id="config-refresh">Refresh</button>
  </section>

  <section id="stinky">
    <h2>Stinky Status</h2>
    <p>Last Bath: TBD</p>
    <button id="stinky-bath">Give Bath</button>
  </section>

  <script src="/tower/tower.js"></script>
</body>
</html>
