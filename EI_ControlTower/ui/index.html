<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HSST Control Tower</title>
  <link rel="stylesheet" href="tower.css">
</head>

<body>
  <h1>HSST CONTROL TOWER</h1>

  <section id="job-pipeline">
    <h2>Job Pipeline</h2>
    <button>Import Job</button>
    <button>Scam Check</button>
    <button>Enrich Company</button>
    <button>Push to SS</button>
  </section>

  <section id="facility-panel">
    <h2>Facility Dashboard</h2>
    <button>Read Thermostat</button>
    <button>Open Dashboard</button>
    <button>Weather Sync</button>
  </section>

  <section id="fax-engine">
    <h2>Fax Engine</h2>
    <button>View Queue</button>
    <button>Retry Failed</button>
    <button>Sent Log</button>
  </section>

  <section id="security">
    <h2>Security</h2>
    <button>Notify SS</button>
    <button>View Log</button>
  </section>

  <section id="config">
    <h2>Config Manager</h2>
    <button>Load Config</button>
    <button>Edit Config</button>
    <button>Refresh</button>
  </section>

  <section id="stinky">
    <h2>Stinky Status</h2>
    <p>Last Bath: TBD</p>
    <button>Give Bath</button>
  </section>

  <script src="tower.js"></script>
</body>
</html>
