<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HSST Control Tower</title>
  <link rel="stylesheet" href="/tower/tower.css">
</head>

<body>
  <h1>HSST CONTROL TOWER</h1>

  <div class="control-tower">
    <section id="job-pipeline">
      <div class="pipeline-content">
        <div class="link-banner">
          <div class="spreadsheet-link">
            <a href="https://docs.google.com/spreadsheets/d/1IYrpGlyCSIilIEyRA70Uq2iUofl-sPA94ygH9ZL-2ag/edit?gid=392501150#gid=392501150" target="_blank" rel="noopener">
              Spreadsheet Activity
            </a>
          </div>
          <div class="thermostat-link">
            <a href="https://tinmanmusicman-ops.github.io/ChatGPT/ai-bots/Thermostats/Web/dashboard_public.html" target="_blank" rel="noopener">
              Thermostat Dashboard
            </a>
          </div>
          <button id="jason-configuration">Jason configuration</button>
        </div>

        <div class="pipeline-body">
          <div class="pipeline-actions">
            <h2>Job Pipeline</h2>
            <button id="import-job">Import Job</button>
            <button id="scam-check">Scam Check</button>
            <button id="verify-company">Verify Company</button>
            <button id="process-fax">Process Fax</button>
            <button id="facility-check">Facility Check</button>
          </div>

          <div class="logo-panel">
            <img src="/tower/hands.png" alt="Hands logo">
          </div>
        </div>
      </div>
    </section>
  </div>

  <script src="/tower/tower.js"></script>
</body>
</html>
