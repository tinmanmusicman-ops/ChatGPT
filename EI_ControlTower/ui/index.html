<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HSST Control Tower</title>
<style>
body {
        forced-color-adjust: none;

  color: #eee;
  font-family: Arial, sans-serif;
  padding: 20px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  animation: colorChange 10s infinate alternate;
}

@keyframes colorChange {
0% { background-color: #291063; }
50% { background-color: #542e6f; }
100% { background-color: #7a5c82; }
}

h1 {
  text-align: center;
  margin-bottom: 32px;
  letter-spacing: 1px;
}

section {
  border: 3px ridge #444;
  border-radius: 10px;
  padding: 20px;
  width: min(780px, 100%);
  background: #0b0b0b;
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
}

.links-bar {

  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
  gap: 12px;
}

.link-buttons {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}

.link-buttons a {
  color: #81d4fa;
  text-decoration: none;
  font-weight: 600;
  font-size: 0.95rem;
}

.link-buttons a:hover {
  text-decoration: underline;
}

.links-bar button {
  background: #222;
  color: #fff;
  border: 1px solid #444;
  border-radius: 6px;
  padding: 8px 14px;
  cursor: pointer;
  font-weight: 600;
}

.dashboard-header-row {
  font-size: 54px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  gap: 16px;
}

.dashboard-title {
  font-size: 54px;
  text-align: center;
  width: 353px;

  margin: 0;
  font-size: 1.3rem;
  color: #c38aff;
  font-weight: 700;
}

.dashboard-logo {
  width: 150px;
  height: 90px;
  object-fit: cover;

}

.header-clock {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto;
}

#flip-clock-frame {
  padding: 0;
  border-radius: 6px;
  border: none;
  display: inline-flex;
  gap: 4px;
  justify-content: center;
  align-items: center;
  position: relative;
  width: min(170px, 100%);
  height: 72px;
  background-image: url("/Images/Clock.png");
  background-size: contain;
  background-repeat: no-repeat;
  background-position: 45% 40%;
  box-shadow: 0 20px 30px rgba(0, 0, 0, 0.8);
}

.flip-clock {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0;
  font-family: "Courier New", monospace;
  position: relative;
  z-index: 1;
  --clock-digit: #a3fca7;
  color: var(--clock-digit);
  transform: translateY(20%);
}

.flip-colon {
  font-size: 20px;
  font-weight: 600;
  color: #a3fca7;
  line-height: 1;
  margin: 0;
  align-self: stretch;
  transform: translateY(-3px);
  padding: 0 1px;
  text-shadow: 0 0 6px rgba(110, 218, 112, 0.9);
}

.flip-unit {
  position: relative;
  width: 26px;
  height: 38px;
  border-radius: 6px;
  border: none;
  overflow: hidden;
  box-shadow:
    inset 0 2px 0 rgba(255, 255, 255, 0.5),
    inset 0 -2px 0 rgba(0, 0, 0, 0.3),
    0 0 6px rgba(163, 252, 167, 0.4);
}

.flip {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  perspective: 800px;
}

.flip .top,
.flip .bottom {
  position: absolute;
  width: 100%;
  height: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #a3fca7;
  font-size: 22px;
  font-weight: 600;
  background: transparent;
  border-radius: 6px;
  backface-visibility: hidden;
  text-shadow: 0 0 6px rgba(110, 218, 112, 0.9);
}

.flip .top {
  top: 0;
  border-bottom: 1px solid rgba(255, 255, 255, 0.15);
  transform-origin: bottom;
  transform: rotateX(0deg);
}

.flip .bottom {
  bottom: 0;
  border-top: 1px solid rgba(255, 255, 255, 0.15);
  transform-origin: top;
  transform: rotateX(90deg);
}

.flip.animate .top {
  animation: flipTop 0.6s ease forwards;
}

.flip.animate .bottom {
  animation: flipBottom 0.6s ease forwards;
}

@keyframes flipTop {
  0% {
    transform: rotateX(0deg);
  }
  100% {
    transform: rotateX(-90deg);
  }
}

@keyframes flipBottom {
  0% {
    transform: rotateX(90deg);
  }
  100% {
    transform: rotateX(0deg);
  }
}

.dashboard-columns {
  display: flex;
  gap: 24px;
  flex-wrap: wrap;
}

.dashboard-left {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 8px;
}


.dashboard-left button {
  color: #c9a7ff;
}

.dashboard-right {
  flex: 1;
  min-width: 220px;
  background: rgba(255, 255, 255, 0.03);
  border-radius: 8px;
  border: 1px solid rgba(255, 255, 255, 0.05);
  padding: 12px;
  box-sizing: border-box;
}

.log-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 10px;
}

.log-normal {
  color: #e0e0e0;
}

.log-start {
  color: #00e5ff;
  font-weight: 600;
}

.log-end {
  color: #00ff95;
  font-weight: 600;
}

.log-error {
  color: #ff4d4d;
  font-weight: 600;
}

.log-heading {
  color: #c8c8ff;
  font-weight: 600;
}

.log-stderr {
  color: #66aaff;
}

.log-info {
  color: #4dd0e1;
}

.log-program {
  color: #c38aff;
}

.btn-active {
  box-shadow: 0 0 12px #c38aff;
  color: #ffffff;
  border-color: #c38aff;
}

.dashboard-right h3 {
  margin-top: 0;
  margin-bottom: 10px;
  font-weight: 600;
}

.dashboard-right pre {
  margin: 0;
  white-space: pre-wrap;
  word-break: break-word;
  font-size: 0.9rem;
  line-height: 1.3;
  color: #ccc;
}

button {
  margin: 0;
  padding: 10px 16px;
  border-radius: 6px;
  border: 1px solid #444;
  background: #222;
  color: #fff;
  cursor: pointer;
  transition: background 0.2s ease;
  font-size: 0.95rem;
  font-weight: 500;
  text-align: left;
}

button:hover {
  background: #2a2a2a;
}

@media (max-width: 640px) {
  .dashboard-columns {
    flex-direction: column;
  }

  .dashboard-logo {
    width: 199px;
    height: 70px;
  }
}
</style>  

</head>

<body>
  <h1>HSST CONTROL DASHBOARD</h1>

  <div class="control-tower">
    <section id="job-pipeline">
      <div class="links-bar">
        <div class="link-buttons">
          <a href="https://docs.google.com/spreadsheets/d/1IYrpGlyCSIilIEyRA70Uq2iUofl-sPA94ygH9ZL-2ag/edit?gid=392501150#gid=392501150" target="_blank" rel="noopener">Spreadsheet Activity</a>
          <a href="https://drive.google.com/drive/u/0/my-drive" target="_blank" rel="noopener">Google Drive</a>
        </div>
        <span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>
        <div class="link-buttons">

          <a href="https://tinmanmusicman-ops.github.io/ChatGPT/ai-bots/Thermostats/Web/dashboard_public.html" target="_blank" rel="noopener">Live Thermostat Dashboard</a>
          <a href="http://localhost/" target="_blank" rel="noopener">Dev Thermostat Dashboard</a>
        </div>
        <button id="json-config-btn">JSON</button>
      </div>

      <div class="dashboard-header-row">
        <h2 class="dashboard-title" style="font-size: 54px;">Job Scripts</h2>
        <div class="header-clock">
          <div id="flip-clock-frame">
            <div class="flip-clock" id="flip-clock">
            <div class="flip-unit" data-unit="hours">
              <div class="flip">
                <div class="top">00</div>
                <div class="bottom">00</div>
              </div>
            </div>
            <div class="flip-colon">:</div>
            <div class="flip-unit" data-unit="minutes">
              <div class="flip">
                <div class="top">00</div>
                <div class="bottom">00</div>
              </div>
            </div>
            <div class="flip-colon">:</div>
            <div class="flip-unit" data-unit="seconds">
              <div class="flip">
                <div class="top">00</div>
                <div class="bottom">00</div>
              </div>
            </div>
          </div>
          </div>
        </div>
        <img src="/Images/Hands.png" alt="HSST hands logo" class="dashboard-logo">
      </div>

      <div class="dashboard-columns">
        <div class="dashboard-left">
          <button id="import-job">Import Job</button>
          <button id="scam-check">Scam Check</button>
          <button id="verify-company">Verify Company</button>
          <button id="process-fax">Process Fax</button>
          <button id="facility-check">Facility Check</button>
        </div>

        <div class="dashboard-right">
          <div class="log-header">
            <h3>Activity Log</h3>
            <button id="copy-log-btn">Copy</button>
            <button id="clear-log-btn">Clear</button>
          </div>
          <pre id="log-output">(logs will appear here)</pre>
        </div>
      </div>
    </section>
  </div>

  <script src="/tower/tower.js"></script>
</body>
</html>
