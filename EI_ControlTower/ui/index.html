<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HSST Control Tower</title>
<style>
body {

  color: #eee;
  font-family: Arial, sans-serif;
  padding: 20px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  animation: colorChange 10s infinate alternate;
}

@keyframes colorChange {
0% { background-color: #291063; }
50% { background-color: #542e6f; }
100% { background-color: #7a5c82; }
}

h1 {
  text-align: center;
  margin-bottom: 32px;
  letter-spacing: 1px;
}

section {
  border: 3px ridge #444;
  border-radius: 10px;
  padding: 20px;
  width: min(780px, 100%);
  background: #0b0b0b;
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
}

.links-bar {

  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
  gap: 12px;
}

.link-buttons {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}

.link-buttons a {
  color: #81d4fa;
  text-decoration: none;
  font-weight: 600;
  font-size: 0.95rem;
}

.link-buttons a:hover {
  text-decoration: underline;
}

.links-bar button {
  background: #222;
  color: #fff;
  border: 1px solid #444;
  border-radius: 6px;
  padding: 8px 14px;
  cursor: pointer;
  font-weight: 600;
}

.dashboard-header-row {
  font-size: 54px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  gap: 16px;
}

.dashboard-title {
  font-size: 54px;
  text-align: center;
  width: 353px;

  margin: 0;
  font-size: 1.3rem;
}

.dashboard-logo {
  width: 150px;
  height: 90px;
  object-fit: cover;

}

.dashboard-columns {
  display: flex;
  gap: 24px;
  flex-wrap: wrap;
}

.dashboard-left {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.dashboard-right {
  flex: 1;
  min-width: 220px;
  background: rgba(255, 255, 255, 0.03);
  border-radius: 8px;
  border: 1px solid rgba(255, 255, 255, 0.05);
  padding: 12px;
  box-sizing: border-box;
}

.dashboard-right h3 {
  margin-top: 0;
  margin-bottom: 10px;
  font-weight: 600;
}

.dashboard-right pre {
  margin: 0;
  white-space: pre-wrap;
  word-break: break-word;
  font-size: 0.9rem;
  line-height: 1.3;
  color: #ccc;
}

button {
  margin: 0;
  padding: 10px 16px;
  border-radius: 6px;
  border: 1px solid #444;
  background: #222;
  color: #fff;
  cursor: pointer;
  transition: background 0.2s ease;
  font-size: 0.95rem;
  font-weight: 500;
  text-align: left;
}

button:hover {
  background: #2a2a2a;
}

@media (max-width: 640px) {
  .dashboard-columns {
    flex-direction: column;
  }

  .dashboard-logo {
    width: 199px;
    height: 70px;
  }
}
</style>  

</head>

<body>
  <h1>HSST CONTROL DASHBOARD</h1>

  <div class="control-tower">
    <section id="job-pipeline">
      <div class="links-bar">
        <div class="link-buttons">
          <a href="https://docs.google.com/spreadsheets/d/1IYrpGlyCSIilIEyRA70Uq2iUofl-sPA94ygH9ZL-2ag/edit?gid=392501150#gid=392501150" target="_blank" rel="noopener">Spreadsheet Activity</a>
          <a href="https://drive.google.com/drive/u/0/my-drive" target="_blank" rel="noopener">Google Drive</a>
        </div>
        <span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>
        <div class="link-buttons">

          <a href="https://tinmanmusicman-ops.github.io/ChatGPT/ai-bots/Thermostats/Web/dashboard_public.html" target="_blank" rel="noopener">Live Thermostat Dashboard</a>
          <a href="http://localhost/" target="_blank" rel="noopener">Dev Thermostat Dashboard</a>
        </div>
        <button id="json-config-btn">JSON</button>
      </div>

      <div class="dashboard-header-row">
        <h2 class="dashboard-title" style="font-size: 54px;">Jobs</h2>
        <img src="/Images/Hands.png" alt="HSST hands logo" class="dashboard-logo">
      </div>

      <div class="dashboard-columns">
        <div class="dashboard-left">
          <button id="import-job">Import Job</button>
          <button id="scam-check">Scam Check</button>
          <button id="verify-company">Verify Company</button>
          <button id="process-fax">Process Fax</button>
          <button id="facility-check">Facility Check</button>
        </div>

        <div class="dashboard-right">
          <h3>Activity Log</h3>
          <pre id="log-output">(logs will appear here)</pre>
        </div>
      </div>
    </section>
  </div>

  <script src="/tower/tower.js"></script>
</body>
</html>
