name: TAM Auto Merge

on:
  push:
    branches:
      - trusted-agent
  pull_request:

jobs:
  tam-verify-and-merge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract TAM intent
        id: intent
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="${{ github.event.pull_request.base.ref }}"
          else
            BASE_REF="${{ github.event.repository.default_branch }}"
          fi

          if ! BASE=$(git merge-base "origin/$BASE_REF" HEAD); then
            echo "WARNING: Unable to resolve merge-base against origin/$BASE_REF"
            exit 0
          fi

          if ! ACTUAL_DIFF=$(git diff "$BASE" HEAD); then
            echo "WARNING: Unable to compute diff from $BASE to HEAD"
            exit 0
          fi

          DIFF_HASH=$(echo "$ACTUAL_DIFF" | sha256sum | awk '{print $1}')

          echo "base=$BASE" >> $GITHUB_OUTPUT
          echo "diff_hash=$DIFF_HASH" >> $GITHUB_OUTPUT

      - name: Verify base commit
        run: |
          if [ -z "${{ steps.intent.outputs.base }}" ]; then
            echo "WARNING: Missing base output; skipping base verification"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="${{ github.event.pull_request.base.ref }}"
          else
            BASE_REF="${{ github.event.repository.default_branch }}"
          fi

          if ! CURRENT_BASE=$(git merge-base "origin/$BASE_REF" HEAD); then
            echo "WARNING: Unable to resolve merge-base against origin/$BASE_REF"
            exit 0
          fi

          if [ "$CURRENT_BASE" != "${{ steps.intent.outputs.base }}" ]; then
            echo "WARNING: Base commit mismatch"
            exit 0
          fi

      - name: Verify diff hash
        run: |
          if [ -z "${{ steps.intent.outputs.base }}" ]; then
            echo "WARNING: Missing base output; skipping diff hash verification"
            exit 0
          fi

          ACTUAL_DIFF=$(git diff ${{ steps.intent.outputs.base }} HEAD)
          ACTUAL_HASH=$(echo "$ACTUAL_DIFF" | sha256sum | awk '{print $1}')

          if [ "$ACTUAL_HASH" != "${{ steps.intent.outputs.diff_hash }}" ]; then
            echo "WARNING: Diff hash mismatch"
            exit 0
          fi

      - name: Merge trusted-agent into ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
        continue-on-error: true
        run: |
          git config user.name "tam-agent"
          git config user.email "tam-agent@users.noreply.github.com"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="${{ github.event.pull_request.base.ref }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_REF="${{ github.event.repository.default_branch }}"
            HEAD_SHA="${{ github.sha }}"
          fi

          git fetch origin "$BASE_REF"
          git checkout -B "$BASE_REF" "origin/$BASE_REF"
          git merge --ff-only "$HEAD_SHA"
          git push origin "HEAD:$BASE_REF"
